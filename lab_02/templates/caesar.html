<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caesar Protocol | Terminal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Share Tech Mono', monospace;
            background-color: #0a0a0a;
            color: #00ff00;
            background-image: 
                linear-gradient(rgba(0, 255, 0, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 0, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
        }
        .cyber-input { background: rgba(0,0,0,0.8); border: 1px solid #333; color: #fff; transition: all 0.3s; }
        .cyber-input:focus { border-color: #00ff00; box-shadow: 0 0 10px rgba(0, 255, 0, 0.2) inset; outline: none; }
        .cyber-btn { background: transparent; border: 1px solid #00ff00; color: #00ff00; text-transform: uppercase; position: relative; overflow: hidden; transition: 0.3s; }
        .cyber-btn::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: #00ff00; transition: 0.3s; z-index: -1; }
        .cyber-btn:hover { color: #000; box-shadow: 0 0 15px #00ff00; }
        .cyber-btn:hover::before { left: 0; }
        .scan-line { width: 100%; height: 2px; background: rgba(0, 255, 0, 0.5); position: absolute; top: 0; left: 0; animation: scan 3s linear infinite; z-index: 50; pointer-events: none; }
        @keyframes scan { 0% { top: 0; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { top: 100%; opacity: 0; } }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 relative">
    <div class="scan-line"></div>
    <div class="w-full max-w-2xl bg-black/80 border border-[#00ff00] p-1 relative shadow-[0_0_30px_rgba(0,255,0,0.15)]">
        <div class="bg-[#00ff00] text-black px-4 py-2 flex justify-between items-center mb-6">
            <span class="font-bold tracking-widest">PROTOCOL: CAESAR</span>
            <span class="text-xs">[ SYS_VER: 2.4.1 ]</span>
        </div>
        <div class="p-6 md:p-8 grid grid-cols-1 md:grid-cols-2 gap-10">
            <section class="border-r-0 md:border-r border-gray-800 md:pr-8">
                <div class="mb-6 border-b border-gray-800 pb-2">
                    <h2 class="text-xl text-white">> ENCRYPT_MODE</h2>
                </div>
                <form method="POST" action="/encrypt" class="space-y-5" onsubmit="animateSubmit(this)">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">INPUT_DATA (Plaintext)</label>
                        <input type="text" name="inputPlainText" class="w-full cyber-input px-3 py-2 text-sm" required autofocus autocomplete="off"/>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">SHIFT_KEY (1 - 25)</label>
                        <input type="number" name="inputKeyPlain" max="25" min="1" class="w-full cyber-input px-3 py-2 text-sm" required autocomplete="off"/>
                        <p class="text-[10px] text-yellow-500 mt-1.5 tracking-wider animate-pulse">> LƯU Ý: Yêu cầu nhập số nguyên từ 1 đến 25</p>
                    </div>
                    <button type="submit" class="cyber-btn w-full py-2 text-sm font-bold tracking-widest mt-4 flex justify-between px-4">
                        <span>EXECUTE</span> <span>// 01</span>
                    </button>
                </form>
            </section>
            <section>
                <div class="mb-6 border-b border-gray-800 pb-2">
                    <h2 class="text-xl text-white">> DECRYPT_MODE</h2>
                </div>
                <form method="POST" action="/decrypt" class="space-y-5" onsubmit="animateSubmit(this)">
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">CIPHER_DATA (Encrypted)</label>
                        <input type="text" name="inputCipherText" class="w-full cyber-input px-3 py-2 text-sm" required autocomplete="off"/>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-400 mb-1">SHIFT_KEY (1 - 25)</label>
                        <input type="number" name="inputKeyCipher" max="25" min="1" class="w-full cyber-input px-3 py-2 text-sm" required autocomplete="off"/>
                        <p class="text-[10px] text-yellow-500 mt-1.5 tracking-wider animate-pulse">> LƯU Ý: Yêu cầu nhập số nguyên từ 1 đến 25</p>
                    </div>
                    <button type="submit" class="cyber-btn w-full py-2 text-sm font-bold tracking-widest mt-4 flex justify-between px-4" style="border-color: #ff003c; color: #ff003c;">
                        <span>REVERSE</span> <span>// 02</span>
                    </button>
                </form>
            </section>
        </div>
        <div class="px-6 py-4 flex justify-between text-xs text-gray-500">
            <a href="/" class="hover:text-[#00ff00] cursor-pointer">< RETURN_TO_ROOT</a>
            <span>STATUS: ONLINE</span>
        </div>
    </div>
    <script>
        function animateSubmit(form) {
            const btn = form.querySelector('button');
            // Lưu lại nội dung gốc của nút trước khi đổi
            const originalText = btn.innerHTML;
            
            // Đổi sang trạng thái Loading và khóa click
            btn.innerHTML = 'PROCESSING... <span class="cursor" style="display:inline-block;width:8px;height:1em;background:currentColor;animation:blink 1s infinite;"></span>';
            btn.style.pointerEvents = 'none';

            // Tự động phục hồi trạng thái nút sau 1.5 giây
            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.style.pointerEvents = 'auto';
            }, 1500);
        }
    </script>
</body>
</html>
